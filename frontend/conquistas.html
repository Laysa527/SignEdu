<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/paginas.css">
    <title>Conquistas | SignEdu</title>
</head>
<body>
    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

    <div class="container-fluid">
        <div class="row">

            <nav class="col-12 col-md-2">

                <div class="text-center mt-3">
                    <a href="perfil.html" title="Meu perfil" aria-label="Meu perfil" class="avatar rounded-circle bg-light d-inline-flex align-items-center justify-content-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="#adb5bd" aria-hidden="true">
                            <path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.4c-3.3 0-9.8 1.6-9.8 4.9v2.5h19.6v-2.5c0-3.3-6.5-4.9-9.8-4.9z"/>
                        </svg>
                    </a>
                </div>

                <ul class="nav flex-column mt-3 px-2">
                    <li class="nav-item mb-2">
                        <a class="btn btn-light sidebar-btn w-100 text-start d-flex align-items-center gap-2" href="perfil.html"><i class="bi bi-house-door" aria-hidden="true"></i> Perfil</a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="btn btn-light sidebar-btn w-100 text-start d-flex align-items-center gap-2" href="praticar.html"><i class="bi bi-camera-video" aria-hidden="true"></i> Praticar</a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="btn btn-light sidebar-btn w-100 text-start d-flex align-items-center gap-2" href="conta.html"><i class="bi bi-person" aria-hidden="true"></i> Conta</a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="btn btn-light sidebar-btn w-100 text-start d-flex align-items-center gap-2" href="configuracoes.html"><i class="bi bi-gear" aria-hidden="true"></i> Configurações</a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="btn btn-light sidebar-btn w-100 text-start d-flex align-items-center gap-2" href="conquistas.html"><i class="bi bi-trophy" aria-hidden="true"></i> Conquistas</a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="btn btn-light sidebar-btn w-100 text-start d-flex align-items-center gap-2" href="ranking.html"><i class="bi bi-bar-chart" aria-hidden="true"></i> Ranking</a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="btn btn-light sidebar-btn w-100 text-start d-flex align-items-center gap-2" href="loja.html"><i class="bi bi-shop" aria-hidden="true"></i> Loja</a>
                    </li>
                </ul>

                <div class="mt-4 px-2">
                    <p class="mb-1">Nível 3</p>
                    <div class="progress">
                        <div class="progress-bar bg-primary" aria-label="Experiência do nível atual" role="progressbar" style="width: 60%;" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                    <!-- preenchidos pelo geral.js -->
                    <p class="small text-muted mt-1 mb-3" id="menu-titulo-nivel">Aprendiz de Libras</p>
                    <p class="small mb-1" id="menu-moedas">250 moedas</p>
                    <p class="small mb-0" id="menu-liga">Liga Prata</p>
                </div>

            </nav>

            <main class="col-12 col-md-10" id="conteudo" tabindex="-1">

                <section class="mt-3">
                    <h1>Minhas conquistas</h1>
                    <p>Clique em uma conquista para ver como você conseguiu.</p>

                    <div class="card mt-3">
                        <div class="card-body">
                            <div class="d-flex justify-content-between mb-1">
                                <span id="resumo-conquistas">0 de 0 conquistas</span>
                                <span class="badge bg-primary" id="resumo-pontos">0 pts</span>
                            </div>
                            <div class="progress barra-conquista">
                                <div class="progress-bar bg-primary" id="barra-resumo" role="progressbar" aria-label="Conquistas obtidas" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="mt-5">
                    <h3>Todas as conquistas</h3>
                    <ul class="nav nav-pills mb-3" id="filtros">
                        <li class="nav-item"><button type="button" class="nav-link active" data-filtro="todas">Todas</button></li>
                        <li class="nav-item"><button type="button" class="nav-link" data-filtro="conquistadas">Conquistadas</button></li>
                        <li class="nav-item"><button type="button" class="nav-link" data-filtro="bloqueadas">Bloqueadas</button></li>
                    </ul>

                    <!-- os cards são criados pelo conquistas.js -->
                    <div class="row g-3 text-center mb-5" id="lista-conquistas"></div>
                </section>

            </main>

        </div>
    </div>

    <!-- Detalhe da conquista (preenchido pelo conquistas.js) -->
    <div class="modal fade" id="modal-conquista" tabindex="-1" aria-labelledby="modal-titulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center">
                <div class="modal-header border-0 pb-0">
                    <button type="button" class="btn-close ms-auto" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body pt-0">
                    <div class="icone-modal" id="modal-icone"></div>
                    <h2 class="h4 mt-2" id="modal-titulo"></h2>
                    <span class="badge bg-primary mb-3" id="modal-pontos"></span>
                    <p class="text-muted" id="modal-descricao"></p>

                    <div class="card text-start mt-3">
                        <div class="card-body">
                            <p class="fw-semibold mb-1" id="modal-subtitulo"></p>
                            <p class="mb-2" id="modal-como"></p>
                            <p class="small text-muted mb-0" id="modal-data"></p>

                            <div class="d-none" id="modal-bloco-progresso">
                                <div class="progress barra-conquista mt-2">
                                    <div class="progress-bar bg-primary" id="modal-barra" role="progressbar" aria-label="Progresso da conquista" style="width: 0%;"></div>
                                </div>
                                <p class="small text-muted mt-1 mb-0" id="modal-progresso-texto"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="js/geral.js"></script>
    <script src="js/conquistas.js"></script>
</body>
</html>
